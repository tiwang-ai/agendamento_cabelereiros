<!DOCTYPE html>
<!-- Define o documento como HTML5 -->
<html lang="pt-BR">
  <!-- Define o idioma da página como Português do Brasil -->
  <head>
    <!-- A seção head contém metadados e links para recursos externos -->
    <meta charset="UTF-8" />
    <!-- Define a codificação de caracteres como UTF-8, suportando caracteres especiais e acentuação -->
    <link rel="icon" type="image/svg+xml" href="/salon-icon.svg" />
    <!-- Define o ícone (favicon) que aparece na aba do navegador -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Configuração de viewport para responsividade em dispositivos móveis:
         - width=device-width: adapta a largura ao dispositivo
         - initial-scale=1.0: define o zoom inicial -->
    <title>Sistema de Agendamento de Cabeleireiros</title>
    <!-- Título da página que aparece na aba do navegador -->
  </head>
  <body>
    <!-- Corpo do documento onde o conteúdo visível é renderizado -->
    <div id="root"></div>
    <!-- Elemento raiz onde o React montará toda a aplicação.
         Este é o ponto de entrada para a interface do usuário -->
    <script type="module" src="/src/main.tsx"></script>
    <!-- Carrega o arquivo principal da aplicação React (main.tsx).
         O atributo "type=module" permite usar importações ES6 no JavaScript -->
  </body>
</html>
